name = "leanux"
version = "0.1.0"
defaultTargets = ["Leanux"]

[[lean_lib]]
name = "Leanux"

[[lean_lib]]
name = "LeanuxProofs"
roots = ["Leanux.Proofs"]

[[lean_exe]]
name = "leanux-model"
root = "Leanux.Main"

# seccomp stream U: the hand-written checker, translation and engine set
# (docs/2026-10-12-seccomp-design.md, 8); `lake build leanux-seccomp-tests && .lake/build/bin/leanux-seccomp-tests`
[[lean_exe]]
name = "leanux-seccomp-tests"
root = "SeccompTests"
srcDir = "tests"

# B3: the timer wheel's arithmetic and order (docs/2026-10-15-design-b3-timer-wheel.md,
# section 9); `lake build leanux-timer-wheel-tests && .lake/build/bin/leanux-timer-wheel-tests`
[[lean_exe]]
name = "leanux-timer-wheel-tests"
root = "TimerWheelTests"
srcDir = "tests"

# Campaign 2's request 3: the dump's peers-nest cancellation restores the
# tail saved before the header (include/net/netlink.h:1925-1934, :1975-1978);
# `lake build leanux-netlink-dump-tests && .lake/build/bin/leanux-netlink-dump-tests`
[[lean_exe]]
name = "leanux-netlink-dump-tests"
root = "NetlinkDumpTests"
srcDir = "tests"
