name = "leanux"
version = "0.1.0"
defaultTargets = ["Leanux"]
moreLeanArgs = ["-j1"]

[[lean_lib]]
name = "Leanux"

[[lean_exe]]
name = "leanux-model"
root = "Leanux.Main"

# seccomp stream U: the hand-written checker, translation and engine set
# (docs/2026-10-12-seccomp-design.md, 8); `lake build leanux-seccomp-tests && .lake/build/bin/leanux-seccomp-tests`
[[lean_exe]]
name = "leanux-seccomp-tests"
root = "SeccompTests"
srcDir = "tests"

# B3: the timer wheel's arithmetic and order (docs/2026-10-15-design-b3-timer-wheel.md,
# section 9); `lake build leanux-timer-wheel-tests && .lake/build/bin/leanux-timer-wheel-tests`
[[lean_exe]]
name = "leanux-timer-wheel-tests"
root = "TimerWheelTests"
srcDir = "tests"
