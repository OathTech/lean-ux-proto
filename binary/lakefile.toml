name = "binaryTV"
version = "0.1.0"
defaultTargets = ["binary-probe"]
moreLeanArgs = ["-j1"]

[[require]]
name = "Kraken"
path = "../.deps/kraken"

[[require]]
name = "leanux"
path = ".."

[[lean_exe]]
name = "binary-probe"
root = "Main"

[[lean_lib]]
name = "BinaryProofs"
roots = ["Execution", "History", "HistoryRegions", "RegionExecution", "MirrorLoop", "MirrorPeer", "MirrorHistory", "LookupObservation", "Memory", "Symbolic", "Image", "ImageLayout", "Layouts", "Regions", "PeerRegions", "PeerPrologue", "Prologue", "BucketEntry", "Representation", "KeypairRepresentation"]
